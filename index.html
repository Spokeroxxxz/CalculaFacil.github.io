<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Calculadoras online gratuitas de porcentagem, regra de três, Pitágoras, descontos e conversão de unidades.">

    <title>CalculaFácil - Calculadoras Online</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 17px;
            opacity: 0.95;
        }

        nav {
            background: white;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            margin: 0 8px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 15px;
        }

        .intro {
            text-align: center;
            margin-bottom: 25px;
        }

        .intro h2 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .calculadoras {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .card p {
            color: #64748b;
            margin-bottom: 15px;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .resultado {
            margin-top: 15px;
            padding: 13px;
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
            font-weight: bold;
            min-height: 20px;
        }

        .info {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .info h2 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        footer {
            margin-top: 40px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        footer p {
            margin: 5px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            nav {
                overflow-x: auto;
                white-space: nowrap;
            }

            nav a {
                font-size: 14px;
            }
        }
    </style>
</script>

</body>
</html>
